name: GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip forks — secrets are not available on forks and the job would fail
    if: ${{ github.repository_owner == 'tharunstryker' }}
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Separate write token so the commit is not blocked by branch protection
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          output_action: commit
          user: tharunstryker
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 0, 8
          base: header, repositories

          # The 3D contribution landscape from the reference style
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Coding rhythm and daily activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Technology and project signal
          plugin_languages: yes
          plugin_languages_sections: recently-used, most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_colors: github
          plugin_repositories: yes
          plugin_repositories_affiliations: owner, collaborator, organization_member
          plugin_repositories_featured: psiwatch

          # Profile milestones
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
